name: ngo
description: A Flutter application for connecting NGOs, volunteers, and service seekers.

# Use this to prevent publishing to pub.dev (optional)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  pull_to_refresh: ^2.0.0
  cached_network_image: ^3.3.0
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  app_links: ^6.3.2  # Use a compatible version

flutter:
  uses-material-design: true
  assets:
    - assets/google.png
    - assets/images/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
